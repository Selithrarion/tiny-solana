[package]
name = "tiny-solana"
version = "0.1.0"
edition = "2024"
default-run = "tiny-solana"

[lib]
name = "tiny_solana"
path = "src/lib.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["serde", "rand_core"] }
bs58 = "0.5"
hex = "0.4"
rayon = "1.11"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1.3"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rocksdb = "0.24"
solana_rbpf = "0.8"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5.15"
tracing = "0.1.44"
serde_json = "1.0"
base64 = "0.22.1"
ahash = "0.8"
derive_more = { version = "2.1.1", features = ["full"] }
dashmap = { version = "6.1", features = ["rayon"] }
solana-program = "4.0"
reqwest = { version = "0.13", features = ["json"] }
const-crypto = "0.3"